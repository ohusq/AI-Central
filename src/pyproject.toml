[project]
name = "ai-central"
version = "0.1.0"
description = "AI Central — local AI chatbot with tool-calling backend"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=49.0.0",
    "flask>=3.1.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

# Run with: uv run python server.py
